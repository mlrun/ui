<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLRun UI</title>
  <style>
      body {
          /* Light background similar to the dashboard container */
          background-color: #f9fafc;
          color: #20242b;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
      }
      .card {
          /* White card with the specific border color from the image */
          background-color: #ffffff;
          padding: 40px;
          border-radius: 10px;
          /* Subtle border matching the cards in the screenshot */
          border: 1px solid #e1e4e8;
          /* Very soft shadow to lift it slightly */
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
          text-align: center;
          max-width: 400px;
          min-width: 300px;
      }
      h1 {
          font-size: 22px;
          font-weight: 600;
          margin-bottom: 12px;
          color: #232832; /* Dark header color */
      }
      p {
          color: #7d8995; /* Muted grey text color from the dashboard */
          font-size: 15px;
          line-height: 1.6;
          margin-bottom: 8px;
          margin-top: 0;
      }
      /* Optional: Styled button if you ever need it, matching the theme */
      .highlight {
          color: #28a745; /* Iguazio Green-ish accent */
          font-weight: 600;
      }
  </style>
</head>
<body>
<div class="card">
  <h1>MLRun Remote UI</h1>
  <p>This is a remote module component.</p>
  <p>Please access it via the main <span class="highlight">Iguazio Dashboard</span>.</p>
</div>
</body>
</html>
