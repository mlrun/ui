name: Publish mlrun-ui Image (feature/ig4)

# Builds the mlrun-ui Docker image (micro-frontend variant, IS_MF=true) and
# publishes it to JFrog Artifactory. Job flow adapted from nuclio-ui / oris-ui
# / airun-ui (golden-frog code-scan omitted — not supported in this repo):
#   quality-gate           → lint + format + audit
#   publish-mlrun-image    → docker build (--build-arg IS_MF=true) and push
#
# Requires repository/org secrets:
#   - DOCKER_IMAGE_REGISTRY        Artifactory Docker registry host
#   - PRIVATE_ARTIFACTORY_USERNAME Artifactory Docker login user
#   - PRIVATE_ARTIFACTORY_PASSWORD Artifactory Docker login password

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write
  pull-requests: write
  checks: read

jobs:
  quality-gate:
    name: Quality Gate
    # Runs only on base repository and allowed branches
    if: |
      github.repository == 'mlrun/ui' &&
      github.ref == 'refs/heads/feature/ig4'
    runs-on: mlrun-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Pre-install Security Audit
        run: npm audit --package-lock-only --audit-level=high --registry=https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Verify Lint
        run: npm run lint

      - name: Verify Formatting
        run: npm run format:check

  publish-mlrun-image:
    name: Publish mlrun-ui Image
    needs: [ quality-gate ]
    if: |
      github.repository == 'mlrun/ui' &&
      github.ref == 'refs/heads/feature/ig4' &&
      needs.quality-gate.result == 'success'
    runs-on: mlrun-release

    env:
      REGISTRY: ${{ secrets.DOCKER_IMAGE_REGISTRY }}
      NAMESPACE: 'ui'
      IMAGE_NAME: 'mlrun-ui'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Login to Artifactory (Docker)
        run: |
          echo "${{ secrets.PRIVATE_ARTIFACTORY_PASSWORD }}" | docker login "${REGISTRY}" -u "${{ secrets.PRIVATE_ARTIFACTORY_USERNAME }}" --password-stdin

      - name: Generate Image Tags
        run: |
          VERSION="1.12.0"

          NEW_TAG="${VERSION}-$(date +%Y%m%d%H%M)"
          FULL_IMAGE_NAME="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:${NEW_TAG}"

          echo "Working with: $FULL_IMAGE_NAME"
          echo "FULL_IMAGE_NAME=$FULL_IMAGE_NAME" >> $GITHUB_ENV

      - name: Build Image
        run: |
          docker build --no-cache --pull \
            --build-arg IS_MF=true \
            -t ${{ env.FULL_IMAGE_NAME }} \
            .

      - name: Push Image
        run: |
          docker push ${{ env.FULL_IMAGE_NAME }}
