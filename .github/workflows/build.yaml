name: Build

permissions:

  # Allow the action to upload images to ghcr
  packages: write

on:
  push:
    branches:
    - development
    - '[0-9]+.[0-9]+.x'

  workflow_dispatch:
    inputs:
      docker_registries:
        description: 'Comma separated list of docker registries to push images to (default: ghcr.io/, use registry.hub.docker.com/ for docker hub)'
        required: true
        default: 'ghcr.io/'
      docker_repo:
        description: 'Docker repo to push images to (default: lowercase github repository owner name)'
        required: false
        default: ''
      version:
        description: 'The version to build, without prefix v (e.g. 1.1.0), if not provided version will be <latest-release>-<commit-hash>'
        required: false
        default: ''
      runner:
        description: 'The runner label to use for the workflow (default: ubuntu-latest)'
        required: false
        default: 'ubuntu-latest'

  workflow_call:
    inputs:
      docker_registries:
        description: 'Comma separated list of docker registries to push images to'
        required: false
        type: string
        default: 'ghcr.io/'
      artifactory_docker_repo:
        description: 'Artifactory docker repo name (e.g. mlrun_ce). When set, overrides docker_registries with the Artifactory URL from secrets.'
        required: false
        type: string
        default: ''
      docker_repo:
        description: 'Docker repo to push images to'
        required: false
        type: string
        default: ''
      version:
        description: 'The version to build, without prefix v'
        required: false
        type: string
        default: ''
      runner:
        description: 'The runner label to use for the workflow'
        required: false
        type: string
        default: 'ubuntu-latest'
      ref:
        description: 'The branch or tag to checkout and build'
        required: false
        type: string
        default: ''

jobs:
  build-images:
    name: Build and push ui image
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    # Run on mlrun/ui or when explicitly triggered (workflow_dispatch covers both direct and cross-repo calls)
    if: github.repository == 'mlrun/ui' || github.event_name == 'workflow_dispatch'

    # secrets can't be referenced in step `if:`, so expose the Artifactory host via env
    env:
      ARTIFACTORY_HOST: ${{ secrets.PRIVATE_ARTIFACTORY_DOCKER_URL }}

    steps:
    - uses: actions/checkout@v3
      with:
        repository: mlrun/ui
        ref: ${{ inputs.ref || github.ref }}

    - name: Install curl and jq
      if: ${{ !inputs.runner || inputs.runner == 'ubuntu-latest' }}
      run: sudo apt-get install curl jq

    - name: Extract git hashes and latest version
      id: git_info
      run: |
        echo "mlrun_commit_hash=$(git rev-parse --short=8 $GITHUB_SHA)" >> $GITHUB_OUTPUT
        echo "unstable_version_prefix=$(curl https://raw.githubusercontent.com/mlrun/mlrun/${GITHUB_REF##*/}/automation/version/unstable_version_prefix)" >> $GITHUB_OUTPUT

    - name: Set computed versions params
      id: computed_params
      run: |
        echo "mlrun_version=$( \
          input_mlrun_version=${{ inputs.version }} && \
          default_mlrun_version=$(echo ${{ steps.git_info.outputs.unstable_version_prefix }}-${{ steps.git_info.outputs.mlrun_commit_hash }}) && \
          echo ${input_mlrun_version:-`echo $default_mlrun_version`})" >> $GITHUB_OUTPUT
        echo "mlrun_docker_repo=$( \
          input_docker_repo=${{ inputs.docker_repo }} && \
          default_docker_repo=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]') && \
          echo ${input_docker_repo:-`echo $default_docker_repo`})" >> $GITHUB_OUTPUT
        if [[ -n "$ARTIFACTORY_DOCKER_REPO_INPUT" && -n "$ARTIFACTORY_URL" ]]; then
          echo "mlrun_docker_registries=${ARTIFACTORY_URL}/${ARTIFACTORY_DOCKER_REPO_INPUT}/" >> $GITHUB_OUTPUT
        else
          echo "mlrun_docker_registries=$( \
            input_docker_registries=${{ inputs.docker_registries }} && \
            echo ${input_docker_registries:-ghcr.io/})" >> $GITHUB_OUTPUT
        fi
      env:
        ARTIFACTORY_DOCKER_REPO_INPUT: ${{ inputs.artifactory_docker_repo }}
        ARTIFACTORY_URL: ${{ secrets.PRIVATE_ARTIFACTORY_DOCKER_URL }}

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Docker login (ghcr)
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker login (quay.io)
      if: ${{ !inputs.runner || inputs.runner == 'ubuntu-latest' }}
      continue-on-error: true
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_IO_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.QUAY_IO_DOCKER_REGISTRY_PASSWORD }}

    - name: Docker login (docker.com)
      if: ${{ !inputs.runner || inputs.runner == 'ubuntu-latest' }}
      continue-on-error: true
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        registry: registry.hub.docker.com
        username: ${{ secrets.DOCKER_HUB_DOCKER_REGISTRY_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_DOCKER_REGISTRY_PASSWORD }}

    - name: Docker login (Private Artifactory)
      if: (env.ARTIFACTORY_HOST != '' && contains(inputs.docker_registries, env.ARTIFACTORY_HOST)) || inputs.artifactory_docker_repo != ''
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # 3.6.0
      with:
        registry: ${{ secrets.PRIVATE_ARTIFACTORY_DOCKER_URL }}
        username: ${{ secrets.PRIVATE_ARTIFACTORY_USERNAME }}
        password: ${{ secrets.PRIVATE_ARTIFACTORY_PASSWORD }}

    - name: Build & push image
      run: |

        # if the provided version includes a "+" we replace it with "-" for the docker tag
        tag=$(echo "$MLRUN_VERSION" | sed -E 's/\+/\-/g')
        for registry in $(echo ${{ steps.computed_params.outputs.mlrun_docker_registries }} | sed "s/,/ /g"); \
          do \
            MLRUN_DOCKER_REGISTRY=$registry \
            MLRUN_DOCKER_REPO=${{ steps.computed_params.outputs.mlrun_docker_repo }} \
            MLRUN_DOCKER_TAG=$tag \
            npm run docker; \
            docker push ${registry}${{ steps.computed_params.outputs.mlrun_docker_repo }}/mlrun-ui:$tag; \
          done;
      env:
        MLRUN_VERSION: ${{ steps.computed_params.outputs.mlrun_version }}
