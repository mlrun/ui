name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ['CI', 'E2E regression']
    types: [completed]

permissions: {}

jobs:
  merge:
    name: Approve and merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/npm_and_yarn/auto-merge-npm-patch-')
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Approve and squash-merge once every condition is met
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { run } = require('./.github/scripts/dependabot-auto-merge.cjs')
            await run({ github, context, core })
