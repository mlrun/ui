version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Jerusalem'
    commit-message:
      prefix: '[Dependabot] '
    open-pull-requests-limit: 6
    cooldown:
      default-days: 3

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Jerusalem'
    commit-message:
      prefix: '[Dependabot] '
    open-pull-requests-limit: 6
    cooldown:
      default-days: 7
    groups:
      auto-merge-npm-patch:
        dependency-type: 'production'
        update-types: ['patch']
        exclude-patterns:
          - 'react'
          - 'react-dom'
          - '@module-federation/*'
          - 'react-final-form'
          - 'react-final-form-arrays'
      npm-dev-patch:
        dependency-type: 'development'
        update-types: ['patch']
